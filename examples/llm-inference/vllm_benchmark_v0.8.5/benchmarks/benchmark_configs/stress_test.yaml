# =============================================================================
# vLLM压力测试配置文件
# =============================================================================
#
# 这个配置文件用于对vLLM服务进行压力测试，评估系统在高负载下的稳定性。
# 适用于生产环境部署前的性能验证和容量规划。
#
# 使用方法:
#   # 启动vLLM服务 (建议使用生产环境配置):
#   vllm serve meta-llama/Llama-2-7b-hf \
#     --max-num-seqs 256 \
#     --max-model-len 4096 \
#     --disable-log-requests
#   
#   # 运行压力测试:
#   python enhanced_benchmark_serving.py --config benchmark_configs/stress_test.yaml
#
# 测试场景: 高并发请求，测试系统极限性能和稳定性
# =============================================================================

# ==================== 模型和后端配置 ====================
model: meta-llama/Llama-2-7b-hf    # 测试模型: Llama-2 7B
                                    # 使用广泛验证的模型确保测试可靠性

backend: vllm                       # 推理后端: vLLM
endpoint: /v1/completions           # API端点: Completions接口

# ==================== 高负载配置 ====================
request_rate: inf                   # 请求速率: 无限制 (最大压力)
                                    # inf表示尽可能快地发送所有请求
                                    # 这将测试系统的最大并发处理能力

burstiness: 0.5                     # 突发性: 0.5 (更突发的请求模式)
                                    # 模拟真实环境中的突发流量
                                    # 较低的值产生更不均匀的请求分布

# ==================== 数据集配置 ====================
dataset_name: random                # 数据集: 随机生成
                                    # 使用随机数据消除数据集因素的影响
                                    # 专注于测试系统性能

num_prompts: 500                    # 请求数量: 500个
                                    # 足够的请求数量来观察系统行为
                                    # 在压力测试中平衡测试时间和统计意义

input_len: 512                      # 输入长度: 512 tokens
                                    # 中等长度，平衡内存使用和测试覆盖度

output_len: 256                     # 输出长度: 256 tokens
                                    # 较长的输出增加系统负载

# ==================== 采样参数配置 ====================
temperature: 0.8                    # 温度: 0.8 (增加计算复杂度)
                                    # 非零温度增加采样计算开销

top_p: 0.9                          # Top-p采样: 0.9
                                    # 启用nucleus采样增加计算负载

# ==================== 输出配置 ====================
save_result: true                   # 保存结果: 启用
result_dir: "./stress_test_results" # 结果目录: 专用目录
enable_visualization: true          # 可视化: 启用

# =============================================================================
# 压力测试关键指标:
#
# 1. 系统稳定性指标:
#    - 成功请求率 (应该接近100%)
#    - 错误率和错误类型分布
#    - 系统资源使用情况
#
# 2. 性能退化分析:
#    - 高负载下的TTFT变化
#    - 吞吐量是否线性扩展
#    - 延迟分布的长尾效应
#
# 3. 资源监控建议:
#    - GPU内存使用率和峰值
#    - CPU使用率和负载
#    - 网络带宽和连接数
#    - 系统内存和磁盘I/O
#
# 4. 故障模式观察:
#    - OOM (内存不足) 错误
#    - 超时和连接失败
#    - 队列溢出和请求丢弃
#    - 性能突然下降的临界点
# =============================================================================
