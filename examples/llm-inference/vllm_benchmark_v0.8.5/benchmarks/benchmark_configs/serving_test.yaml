# =============================================================================
# vLLM在线服务基准测试配置文件
# =============================================================================
#
# 这个配置文件用于测试vLLM在线服务的性能，模拟真实的API调用场景。
# 适用于评估模型在生产环境中的响应速度、吞吐量和稳定性。
#
# 使用方法:
#   python enhanced_benchmark_serving.py --config benchmark_configs/serving_test.yaml
#
# 测试场景: 使用ShareGPT真实对话数据，以中等负载测试在线服务性能
# =============================================================================

# ==================== 模型和后端配置 ====================
model: meta-llama/Llama-2-7b-hf    # 测试模型: Llama-2 7B参数版本
                                    # 这是一个中等规模的开源模型，适合基准测试
                                    # 可替换为其他HuggingFace模型ID或本地路径

backend: vllm                       # 推理后端: vLLM
                                    # vLLM是高性能的LLM推理引擎，支持:
                                    # - 连续批处理 (Continuous Batching)
                                    # - PagedAttention内存管理
                                    # - 多种优化技术

endpoint: /v1/completions           # API端点: OpenAI兼容的completions接口
                                    # vLLM提供OpenAI兼容的API，便于集成现有应用
                                    # 其他可选端点: /v1/chat/completions

# ==================== 数据集配置 ====================
dataset_name: sharegpt              # 数据集类型: ShareGPT
                                    # ShareGPT包含真实的用户-助手对话数据
                                    # 能够反映实际使用场景的输入分布

dataset_path: ./ShareGPT_V3_unfiltered_cleaned_split.json
                                    # 数据集文件路径 (相对于脚本运行目录)
                                    # 需要先下载ShareGPT数据集:
                                    # wget https://huggingface.co/datasets/anon8231489123/ShareGPT_Vicuna_unfiltered/resolve/main/ShareGPT_V3_unfiltered_cleaned_split.json

num_prompts: 100                    # 测试请求数量: 100个
                                    # 适中的请求数量，既能获得统计意义，又不会耗时过长
                                    # 生产环境测试建议使用1000+请求

# ==================== 负载控制配置 ====================
request_rate: 2.0                  # 请求发送速率: 每秒2个请求
                                    # 模拟中等负载场景，适合评估服务稳定性
                                    # 可选值:
                                    # - 1.0: 轻负载测试
                                    # - 5.0: 重负载测试
                                    # - inf: 最大压力测试

# ==================== 输出和可视化配置 ====================
save_result: true                   # 保存测试结果到文件
                                    # 结果将保存为JSON格式，包含详细的性能指标

enable_visualization: true          # 启用可视化功能
                                    # 自动生成性能分析图表和HTML报告
                                    # 包括: 吞吐量图表、延迟分布、百分位数分析等
