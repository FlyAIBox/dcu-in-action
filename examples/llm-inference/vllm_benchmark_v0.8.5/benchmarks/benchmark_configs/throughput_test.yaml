# =============================================================================
# vLLM离线吞吐量基准测试配置文件
# =============================================================================
#
# 这个配置文件用于测试vLLM的最大吞吐量性能，不考虑在线服务的延迟要求。
# 适用于评估模型在批处理场景下的处理能力和资源利用效率。
#
# 使用方法:
#   python benchmark_throughput.py --config benchmark_configs/throughput_test.yaml
#   或者使用增强版脚本 (如果支持离线模式):
#   python enhanced_benchmark_serving.py --config benchmark_configs/throughput_test.yaml
#
# 测试场景: 使用随机生成数据，测试模型的纯推理性能上限
# =============================================================================

# ==================== 模型和后端配置 ====================
model: meta-llama/Llama-2-7b-hf    # 测试模型: Llama-2 7B参数版本
                                    # 选择相同模型便于与在线服务测试结果对比
                                    # 7B模型在单GPU上有良好的性能表现

backend: vllm                       # 推理后端: vLLM
                                    # 在离线模式下，vLLM可以充分利用批处理优化
                                    # 实现更高的吞吐量和GPU利用率

# ==================== 并行配置 ====================
tensor_parallel_size: 1             # 张量并行度: 1 (单GPU)
                                    # 控制模型在多GPU上的分布方式
                                    # 可选值:
                                    # - 1: 单GPU推理
                                    # - 2: 双GPU张量并行
                                    # - 4: 四GPU张量并行
                                    # - 8: 八GPU张量并行

# ==================== 数据集配置 ====================
dataset_name: random                # 数据集类型: 随机生成
                                    # 使用随机数据可以:
                                    # - 消除数据集偏差的影响
                                    # - 精确控制输入输出长度
                                    # - 获得更稳定的性能基准

num_prompts: 1000                   # 测试请求数量: 1000个
                                    # 较大的请求数量确保统计结果的稳定性
                                    # 吞吐量测试通常需要更多样本来平均化性能波动

# ==================== 序列长度配置 ====================
input_len: 1024                     # 输入序列长度: 1024 tokens
                                    # 这是一个常见的输入长度，适合大多数应用场景
                                    # 对应约800-1000个英文单词或500-600个中文字符

output_len: 128                     # 输出序列长度: 128 tokens
                                    # 适中的输出长度，平衡测试时间和实用性
                                    # 对应约100个英文单词或60-80个中文字符

# ==================== 可视化配置 ====================
enable_visualization: true          # 启用可视化功能
                                    # 生成吞吐量分析图表，包括:
                                    # - 吞吐量指标对比
                                    # - Token处理速度分析
                                    # - 资源利用率统计
                                    # - 性能配置对比表格

# =============================================================================
# 性能优化建议:
#
# 1. GPU内存优化:
#    - 如果遇到OOM，可以减少input_len或output_len
#    - 使用更大的GPU或增加tensor_parallel_size
#
# 2. 吞吐量优化:
#    - 增加num_prompts可以更好地利用批处理
#    - 调整vLLM的max_num_seqs参数
#
# 3. 对比测试:
#    - 修改tensor_parallel_size测试多GPU扩展性
#    - 调整序列长度测试不同场景的性能
# =============================================================================
