# =============================================================================
# 代码生成模型基准测试配置文件
# =============================================================================
#
# 这个配置文件专门用于测试代码生成模型的性能，评估在编程任务上的表现。
# 适用于代码助手、自动编程工具等应用场景的性能评估。
#
# 使用方法:
#   # 启动代码模型服务:
#   vllm serve codellama/CodeLlama-7b-Instruct-hf \
#     --max-model-len 8192 \
#     --disable-log-requests
#   
#   # 运行代码生成基准测试:
#   python enhanced_benchmark_serving.py --config benchmark_configs/code_generation_test.yaml
#
# 测试场景: 使用InstructCoder数据集评估代码生成和理解能力
# =============================================================================

# ==================== 模型和后端配置 ====================
model: codellama/CodeLlama-7b-Instruct-hf
                                    # 代码生成模型: CodeLlama 7B指令版
                                    # Meta开源的专业代码生成模型
                                    # 特点:
                                    # - 专门针对代码任务训练
                                    # - 支持多种编程语言
                                    # - 优秀的代码补全和生成能力
                                    # - 支持长达8K的上下文

backend: vllm                       # 推理后端: vLLM
endpoint: /v1/completions           # API端点

# ==================== 数据集配置 ====================
dataset_name: hf                    # 数据集类型: HuggingFace
dataset_path: likaixin/InstructCoder # InstructCoder代码指令数据集
                                    # 包含各种编程任务:
                                    # - 代码生成和补全
                                    # - 代码解释和注释
                                    # - 代码调试和修复
                                    # - 算法实现

hf_split: train                     # 使用训练集数据
num_prompts: 100                    # 测试请求数量: 100个
                                    # 代码生成任务相对复杂，使用适中的数量

# ==================== 序列长度配置 ====================
input_len: 1024                     # 输入长度: 1024 tokens
                                    # 代码任务通常需要较长的上下文
                                    # 包含问题描述、示例、约束条件等

output_len: 512                     # 输出长度: 512 tokens
                                    # 代码生成通常需要较长的输出
                                    # 包含完整的函数或类实现

max_model_len: 8192                 # 最大模型长度: 8192 tokens
                                    # 代码模型通常支持更长的上下文
                                    # 适应复杂的编程任务需求

# ==================== 采样参数配置 ====================
temperature: 0.1                    # 温度: 0.1 (低温度)
                                    # 代码生成需要较高的确定性
                                    # 低温度减少随机性，提高代码质量

top_p: 0.95                         # Top-p: 0.95
                                    # 保持一定的多样性，避免过于死板

# ==================== 负载配置 ====================
request_rate: 1.0                   # 请求速率: 1 req/s
                                    # 代码生成任务计算密集，使用较低速率
                                    # 给模型充分时间生成高质量代码

# ==================== 输出配置 ====================
save_result: true                   # 保存结果
result_dir: "./code_generation_results"  # 专用结果目录
result_filename: "codellama_benchmark"    # 结果文件名
enable_visualization: true          # 启用可视化

# =============================================================================
# 代码生成测试特殊考虑:
#
# 1. 性能特点:
#    - 代码生成通常比文本生成更慢
#    - 需要更多的推理步骤和语法检查
#    - 输出质量对温度参数敏感
#
# 2. 评估维度:
#    - 生成速度 (TTFT, TPOT)
#    - 代码正确性 (语法、逻辑)
#    - 代码风格和可读性
#    - 任务完成度
#
# 3. 数据集特点:
#    - InstructCoder包含多种编程语言
#    - 任务难度从简单到复杂
#    - 包含实际的编程场景
#
# 4. 优化建议:
#    - 调整温度参数平衡质量和多样性
#    - 使用更长的上下文窗口
#    - 考虑使用专门的代码评估指标
#
# 5. 其他可测试的代码模型:
#    - microsoft/DialoGPT-medium
#    - Salesforce/codegen-350M-mono
#    - bigcode/starcoder
#    - WizardLM/WizardCoder-15B-V1.0
#
# 6. 扩展测试:
#    - 不同编程语言的性能对比
#    - 代码补全 vs 从零生成
#    - 不同复杂度任务的性能差异
# =============================================================================
