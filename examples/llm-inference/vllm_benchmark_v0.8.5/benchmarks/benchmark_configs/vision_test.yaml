# =============================================================================
# 视觉语言模型基准测试配置文件
# =============================================================================
#
# 这个配置文件专门用于测试视觉语言模型(VLM)的性能，支持图像+文本的多模态输入。
# 适用于评估模型在图像理解、视觉问答、图像描述等任务上的表现。
#
# 使用方法:
#   # 首先启动支持视觉的vLLM服务:
#   vllm serve Qwen/Qwen2-VL-7B-Instruct --disable-log-requests
#
#   # 然后运行基准测试:
#   python enhanced_benchmark_serving.py --config benchmark_configs/vision_test.yaml
#
# 测试场景: 使用VisionArena真实的视觉对话数据，评估多模态理解能力
# =============================================================================

# ==================== 模型和后端配置 ====================
model: Qwen/Qwen2-VL-7B-Instruct    # 视觉语言模型: 通义千问VL 7B指令版
                                     # Qwen2-VL是阿里巴巴开源的多模态大模型
                                     # 特点:
                                     # - 支持图像和文本的联合理解
                                     # - 优秀的中英文视觉问答能力
                                     # - 支持高分辨率图像处理

backend: openai-chat                 # 后端类型: OpenAI Chat格式
                                     # 多模态模型通常使用chat格式的API
                                     # 支持结构化的消息格式，包含文本和图像

endpoint: /v1/chat/completions       # API端点: Chat Completions接口
                                     # 这是OpenAI标准的对话接口
                                     # 支持多轮对话和多模态内容

# ==================== 数据集配置 ====================
dataset_name: hf                     # 数据集类型: HuggingFace数据集
                                     # 使用HuggingFace Hub上的公开数据集
                                     # 便于数据获取和版本管理

dataset_path: lmarena-ai/VisionArena-Chat
                                     # 数据集路径: VisionArena对话数据集
                                     # VisionArena是专门的视觉语言模型评测数据集
                                     # 包含真实用户与VLM的交互数据
                                     # 涵盖图像描述、视觉问答、推理等任务

hf_split: train                      # 数据集分割: 训练集
                                     # HuggingFace数据集的分割选择
                                     # 可选值:
                                     # - train: 训练集 (通常数据量最大)
                                     # - test: 测试集
                                     # - validation: 验证集

num_prompts: 50                      # 测试请求数量: 50个
                                     # 视觉模型推理较慢，使用较少的请求数
                                     # 每个请求包含图像处理，计算开销更大
                                     # 50个请求足以获得有意义的性能统计

# ==================== 可视化配置 ====================
enable_visualization: true          # 启用可视化功能
                                     # 生成多模态模型专用的分析图表:
                                     # - 图像处理时间分析
                                     # - 多模态vs纯文本性能对比
                                     # - 不同图像尺寸的性能影响
                                     # - 视觉理解质量评估

# =============================================================================
# 多模态测试特殊说明:
#
# 1. 性能特点:
#    - 首Token时间(TTFT)通常比纯文本模型更长，因为需要处理图像
#    - 每Token时间(TPOT)可能相对稳定，主要开销在图像编码阶段
#    - 内存使用量显著增加，需要存储图像特征
#
# 2. 数据集特点:
#    - VisionArena包含真实的用户-模型交互数据
#    - 图像类型多样：照片、图表、截图、艺术作品等
#    - 任务类型丰富：描述、问答、分析、创作等
#
# 3. 测试建议:
#    - 确保GPU内存充足 (推荐16GB+)
#    - 可以调整num_prompts来控制测试时间
#    - 关注图像分辨率对性能的影响
#    - 对比不同VLM模型的性能差异
#
# 4. 其他可测试的VLM模型:
#    - llava-hf/llava-1.5-7b-hf
#    - microsoft/kosmos-2-patch14-224
#    - Salesforce/blip2-opt-2.7b
# =============================================================================
