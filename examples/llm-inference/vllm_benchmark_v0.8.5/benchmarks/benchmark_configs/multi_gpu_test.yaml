# =============================================================================
# 多GPU并行基准测试配置文件
# =============================================================================
#
# 这个配置文件用于测试vLLM在多GPU环境下的并行性能和扩展性。
# 适用于评估张量并行和流水线并行的效果，优化多GPU部署策略。
#
# 使用方法:
#   # 启动多GPU vLLM服务:
#   vllm serve meta-llama/Llama-2-13b-hf \
#     --tensor-parallel-size 4 \
#     --pipeline-parallel-size 1 \
#     --disable-log-requests
#   
#   # 运行多GPU基准测试:
#   python enhanced_benchmark_serving.py --config benchmark_configs/multi_gpu_test.yaml
#
# 测试场景: 大模型多GPU并行推理性能评估
# =============================================================================

# ==================== 模型和后端配置 ====================
model: meta-llama/Llama-2-13b-hf   # 测试模型: Llama-2 13B
                                    # 选择13B模型需要多GPU才能高效运行
                                    # 更好地体现并行化的效果

backend: vllm                       # 推理后端: vLLM
endpoint: /v1/completions           # API端点

# ==================== 并行配置 ====================
tensor_parallel_size: 4             # 张量并行度: 4GPU
                                    # 将模型权重分布到4个GPU上
                                    # 适合内存受限但需要低延迟的场景
                                    # 注意: 需要GPU间高速互联 (NVLink/InfiniBand)

pipeline_parallel_size: 1           # 流水线并行度: 1 (不使用)
                                    # 流水线并行将模型层分布到不同GPU
                                    # 适合超大模型，但会增加延迟
                                    # 可以尝试设置为2来测试效果

# ==================== 数据集配置 ====================
dataset_name: random                # 数据集: 随机生成
                                    # 消除数据集变量，专注测试并行性能

num_prompts: 200                    # 请求数量: 200个
                                    # 足够观察并行效果，不会过度消耗资源

input_len: 2048                     # 输入长度: 2048 tokens
                                    # 较长输入更能体现多GPU的优势
                                    # 大输入需要更多计算和内存

output_len: 512                     # 输出长度: 512 tokens
                                    # 较长输出测试生成阶段的并行效果

# ==================== 负载配置 ====================
request_rate: 5.0                   # 请求速率: 5 req/s
                                    # 中高负载，测试多GPU的吞吐量优势

# ==================== 高级配置 ====================
max_model_len: 4096                 # 最大模型长度: 4096 tokens
                                    # 支持更长的上下文，充分利用模型能力

trust_remote_code: false            # 信任远程代码: 关闭 (安全考虑)

# ==================== 输出配置 ====================
save_result: true                   # 保存结果
result_dir: "./multi_gpu_results"   # 专用结果目录
enable_visualization: true          # 启用可视化

# =============================================================================
# 多GPU性能分析要点:
#
# 1. 并行效率指标:
#    - 理想情况下，4GPU应该提供接近4倍的吞吐量
#    - 实际效率通常在70-90%之间
#    - 计算并行效率 = (多GPU吞吐量) / (单GPU吞吐量 × GPU数量)
#
# 2. 延迟分析:
#    - 张量并行通常不会显著增加延迟
#    - 流水线并行会增加延迟但提高吞吐量
#    - 观察TTFT和TPOT的变化
#
# 3. 内存使用:
#    - 张量并行: 每个GPU使用 1/N 的模型内存
#    - 流水线并行: 每个GPU使用 1/N 的模型内存
#    - 激活内存仍然需要在每个GPU上复制
#
# 4. 通信开销:
#    - All-reduce操作的频率和耗时
#    - GPU间带宽利用率
#    - 网络拓扑对性能的影响
#
# 5. 扩展性测试建议:
#    - 测试不同的tensor_parallel_size (1, 2, 4, 8)
#    - 比较不同模型大小的扩展效果
#    - 评估成本效益比 (性能提升 vs GPU成本)
#
# 6. 故障排查:
#    - 检查GPU间通信是否正常
#    - 监控各GPU的负载均衡
#    - 观察内存使用是否均匀分布
# =============================================================================
