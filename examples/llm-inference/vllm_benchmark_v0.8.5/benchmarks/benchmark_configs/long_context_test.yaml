# =============================================================================
# 长上下文基准测试配置文件
# =============================================================================
#
# 这个配置文件用于测试模型在长上下文场景下的性能，评估长文档理解能力。
# 适用于文档问答、长文本摘要、多轮对话等需要长期记忆的应用场景。
#
# 使用方法:
#   # 启动支持长上下文的vLLM服务:
#   vllm serve meta-llama/Llama-2-7b-hf \
#     --max-model-len 16384 \
#     --enable-chunked-prefill \
#     --disable-log-requests
#   
#   # 运行长上下文基准测试:
#   python enhanced_benchmark_serving.py --config benchmark_configs/long_context_test.yaml
#
# 测试场景: 长文档理解和问答任务性能评估
# =============================================================================

# ==================== 模型和后端配置 ====================
model: meta-llama/Llama-2-7b-hf    # 基础模型: Llama-2 7B
                                    # 虽然原生支持4K上下文，但可以扩展测试
                                    # 也可以替换为支持更长上下文的模型:
                                    # - meta-llama/Llama-2-7b-chat-hf
                                    # - mistralai/Mistral-7B-Instruct-v0.1

backend: vllm                       # 推理后端: vLLM
endpoint: /v1/completions           # API端点

# ==================== 长上下文配置 ====================
max_model_len: 16384                # 最大模型长度: 16K tokens
                                    # 扩展上下文窗口测试长文档处理能力
                                    # 注意: 需要足够的GPU内存支持

input_len: 8192                     # 输入长度: 8K tokens
                                    # 模拟长文档输入场景
                                    # 相当于约6000-8000个英文单词

output_len: 1024                    # 输出长度: 1K tokens
                                    # 较长的输出用于详细回答或摘要

# ==================== 数据集配置 ====================
dataset_name: random                # 数据集: 随机生成
                                    # 使用随机数据确保输入长度的精确控制
                                    # 消除数据集内容对性能的影响

num_prompts: 50                     # 请求数量: 50个
                                    # 长上下文处理耗时较长，使用较少请求
                                    # 每个请求的处理时间显著增加

# ==================== 性能优化配置 ====================
# 以下参数需要在vLLM启动时设置，这里仅作说明
# enable_chunked_prefill: true      # 启用分块预填充
                                    # 将长输入分块处理，减少内存峰值
                                    # 对长上下文场景特别重要

# max_num_batched_tokens: 8192      # 最大批处理token数
                                    # 控制批处理大小，平衡吞吐量和延迟

# ==================== 采样参数配置 ====================
temperature: 0.7                    # 温度: 0.7
                                    # 适中的温度保持输出质量和多样性

top_p: 0.9                          # Top-p: 0.9
                                    # Nucleus采样参数

# ==================== 负载配置 ====================
request_rate: 0.5                   # 请求速率: 0.5 req/s
                                    # 长上下文处理需要更多时间
                                    # 使用较低的请求速率避免队列积压

# ==================== 输出配置 ====================
save_result: true                   # 保存结果
result_dir: "./long_context_results" # 专用结果目录
enable_visualization: true          # 启用可视化

# =============================================================================
# 长上下文测试关键指标:
#
# 1. 内存使用分析:
#    - 注意力机制的内存复杂度是O(n²)
#    - 监控GPU内存使用峰值
#    - 观察内存使用随输入长度的变化
#
# 2. 性能退化分析:
#    - TTFT随输入长度的增长趋势
#    - 长上下文是否影响生成质量
#    - 处理速度的非线性变化
#
# 3. 优化效果评估:
#    - 分块预填充的效果
#    - KV缓存的内存效率
#    - 注意力优化算法的影响
#
# 4. 实际应用考虑:
#    - 文档问答的准确性
#    - 长对话的一致性维持
#    - 信息检索的效率
#
# 5. 扩展测试建议:
#    - 测试不同输入长度 (1K, 2K, 4K, 8K, 16K)
#    - 对比不同模型的长上下文能力
#    - 评估成本效益 (性能 vs 资源消耗)
#
# 6. 故障排查:
#    - OOM错误的处理
#    - 超长输入的截断策略
#    - 性能瓶颈的识别
#
# 7. 推荐的长上下文模型:
#    - anthropic/claude-2 (100K上下文)
#    - google/longformer-base-4096
#    - microsoft/DialoGPT-large
#    - 01-ai/Yi-6B-200K
# =============================================================================
